[project]
name = "feelmyrythm-server"
version = "0.1.0"
description = "FeelMyRythm REST API and deterministic synchronization gateway"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2",
  "bcrypt>=4.2,<5",
  "boto3>=1.35,<2",
  "defusedxml>=0.7,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "google-auth>=2.38,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-defusedxml>=0.7,<1",
  "types-pyjwt>=1.7,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "google", "google.*"]
ignore_missing_imports = true
