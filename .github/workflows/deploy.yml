name: Build and deploy to RPi5

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: feelmyrythm-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/facio313/feelmyrythm-server
  WEB_IMAGE: ghcr.io/facio313/feelmyrythm-web
  POSTGRES_RUNTIME_IMAGE: postgres:17.11-alpine@sha256:5d61573b31c206ae538c85893edeb6e320e1a9ffd838c0f9dca927fb6f765fa4
  REDIS_RUNTIME_IMAGE: redis:8.2.7-alpine@sha256:223b183cbc49f5ff48728e1fc52ccf101f05072decad2bd9867281a3c9bf75fd

jobs:
  publish:
    name: Publish validated immutable ARM64 images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      deploy_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate source identity
        id: source
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$VALIDATED_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          VALIDATED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$VALIDATED_SHA" ]]

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.event.workflow_run.actor.login }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Test server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./apps/server
          target: test
          platforms: linux/arm64
          push: false
          pull: true
          cache-from: type=gha,scope=feelmyrythm-server

      - name: Build immutable server runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./apps/server
          platforms: linux/arm64
          load: true
          push: false
          pull: true
          tags: ${{ env.SERVER_IMAGE }}:${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=feelmyrythm-server
          cache-to: type=gha,mode=max,scope=feelmyrythm-server

      - name: Build immutable web runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          pull: true
          tags: ${{ env.WEB_IMAGE }}:${{ steps.source.outputs.sha }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_FMR_MANAGED_LOCAL_SSO=true
            VITE_FMR_SSO_ENABLED=true
          cache-from: type=gha,scope=feelmyrythm-web
          cache-to: type=gha,mode=max,scope=feelmyrythm-web

      - name: Smoke-test the exact runtime images
        env:
          SERVER_RUNTIME_IMAGE: ${{ env.SERVER_IMAGE }}:${{ steps.source.outputs.sha }}
          WEB_RUNTIME_IMAGE: ${{ env.WEB_IMAGE }}:${{ steps.source.outputs.sha }}
          POSTGRES_RUNTIME_IMAGE: ${{ env.POSTGRES_RUNTIME_IMAGE }}
          REDIS_RUNTIME_IMAGE: ${{ env.REDIS_RUNTIME_IMAGE }}
        run: bash .github/scripts/smoke-runtime-images.sh

      - name: Publish the smoke-tested immutable images
        env:
          SERVER_RUNTIME_IMAGE: ${{ env.SERVER_IMAGE }}:${{ steps.source.outputs.sha }}
          WEB_RUNTIME_IMAGE: ${{ env.WEB_IMAGE }}:${{ steps.source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          docker push "$SERVER_RUNTIME_IMAGE"
          docker push "$WEB_RUNTIME_IMAGE"

  deploy:
    name: Request restricted server deployment
    needs: publish
    runs-on: ubuntu-24.04
    # The host serializes portfolio deploys with a lock that may wait up to 20 minutes.
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    steps:
      - name: Request restricted server deployment
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_SHA: ${{ needs.publish.outputs.deploy_sha }}
          GHCR_TOKEN: ${{ github.token }}
          DEPLOY_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          trap 'rm -f "$HOME/.ssh/deploy_key"' EXIT

          printf '%s\n' \
            '[ssh.bonifacio.work]:22022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII91ovdQZMg9NpUyjjFSS0Ra0SEuYuAw4Uv3GTv6J92F' \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          {
            printf '%s\n' "$GHCR_TOKEN"
            printf '%s\n' "$DEPLOY_ACTOR"
          } | ssh -T \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p 22022 \
            cks@ssh.bonifacio.work \
            "deploy feelmyrythm $DEPLOY_SHA"
