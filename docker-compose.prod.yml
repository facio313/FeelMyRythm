# 운영용 (라즈베리파이). 로컬 개발은 도커 없이 실행한다 (README 참고).
# 서버의 /home/cks/FeelMyRythm 에서 GitHub Actions 가 실행:
#   docker compose -f docker-compose.prod.yml up --build -d
# 필요 파일: .env (POSTGRES_PASSWORD, FMR_JWT_SECRET)
services:
  fmrDB:
    image: postgres:16
    container_name: fmrDB
    environment:
      POSTGRES_DB: feelmyrythm
      POSTGRES_USER: fmr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fmrDBData:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - feelmyrythm
    restart: always

  fmrServer:
    build: ./apps/server
    image: feelmyrythm-server
    container_name: fmrServer
    depends_on:
      - fmrDB
    env_file: .env
    environment:
      FMR_DATABASE_URL: postgresql+psycopg://fmr:${POSTGRES_PASSWORD}@fmrDB:5432/feelmyrythm
      FMR_UPLOADS_DIR: /data/uploads
    volumes:
      - fmrUploads:/data/uploads
    ports:
      - "127.0.0.1:9175:8000"
    networks:
      - feelmyrythm
    restart: always

  fmrWeb:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: feelmyrythm-web
    container_name: fmrWeb
    depends_on:
      - fmrServer
    ports:
      - "127.0.0.1:5175:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - feelmyrythm
    restart: always

volumes:
  fmrDBData:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/cks/FeelMyRythm/dbmnt
  fmrUploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/cks/FeelMyRythm/uploadsmnt

networks:
  feelmyrythm:
    name: feelmyrythm
    driver: bridge
