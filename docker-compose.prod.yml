# Production app services only. The shared PostgreSQL container is managed separately as cksDB.
# Required .env values:
#   FMR_DATABASE_URL=postgresql+psycopg://<user>:<password>@cksDB:5432/feelmyrythm
#   FMR_JWT_SECRET=<long-random-secret>
services:
  fmrServer:
    image: ${FEELMYRYTHM_SERVER_IMAGE:-ghcr.io/facio313/feelmyrythm-server:latest}
    container_name: fmrServer
    env_file:
      - .env
    environment:
      FMR_UPLOADS_DIR: /data/uploads
    volumes:
      - fmrUploads:/data/uploads
    ports:
      - "127.0.0.1:9175:8000"
    networks:
      - feelmyrythm
      - cksDB
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)" || exit 1
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  fmrWeb:
    image: ${FEELMYRYTHM_WEB_IMAGE:-ghcr.io/facio313/feelmyrythm-web:latest}
    container_name: fmrWeb
    depends_on:
      fmrServer:
        condition: service_healthy
    ports:
      - "127.0.0.1:5175:80"
    networks:
      - feelmyrythm
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/feelmyrythm/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

volumes:
  fmrUploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/cks/FeelMyRythm/uploadsmnt

networks:
  feelmyrythm:
    name: feelmyrythm
    driver: bridge
  cksDB:
    external: true
    name: cksDB
