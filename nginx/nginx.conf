server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 50m;

    add_header_inherit merge;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    location = /feelmyrythm {
        return 308 /feelmyrythm/;
    }

    location /feelmyrythm/api/ {
        proxy_pass http://fmrServer:8000/api/;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Email $http_remote_email;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_read_timeout 60s;
    }

    location /feelmyrythm/ws/ {
        proxy_pass http://fmrServer:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /feelmyrythm/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /feelmyrythm/ {
        try_files $uri $uri/ /feelmyrythm/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
