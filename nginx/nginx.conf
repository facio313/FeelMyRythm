server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 악보 PDF 업로드 허용 용량
    client_max_body_size 50m;

    location = /feelmyrythm {
        return 308 /feelmyrythm/;
    }

    # 브라우저에는 앱 prefix를 유지하고 FastAPI에는 원래 /api 경로를 전달한다.
    location /feelmyrythm/api/ {
        proxy_pass http://fmrServer:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (시계 동기 + 트랜스포트)
    location /feelmyrythm/ws/ {
        proxy_pass http://fmrServer:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /feelmyrythm/ {
        try_files $uri $uri/ /feelmyrythm/index.html;
    }

    location / {
        return 404;
    }
}
